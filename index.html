<!DOCTYPE html>
<html lang="cs" data-theme="dark">
<head>

  <title>Gym</title>

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0A0A0A">

  <!-- iOS: spuštění z plochy jako samostatná appka -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <meta name="format-detection" content="telephone=no">

  <script>
    // motiv hned při načtení, ať neproblikne tmavý
    try { if (localStorage.getItem('gym-theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
</head>

        <span data-i18n="Nastavení">Nastavení</span>
